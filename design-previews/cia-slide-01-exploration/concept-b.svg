<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title description" lang="th">
 <title id="title">ถ้าข้อมูลถูกเปิดเผย ถูกเปลี่ยน หรือใช้ไม่ได้ ภารกิจจะเดินต่ออย่างไร?</title>
 <desc id="description">คำถามสมมติเชื่อมผลกระทบต่อข้อมูลกับพันธกิจขององค์กร ภาพเอกสารประกอบสามเป้าหมาย C Confidentiality รักษาความลับ I Integrity ป้องกันการแก้ไขโดยไม่ได้รับอนุญาต A Availability ให้ผู้มีสิทธิ์เข้าถึงได้เมื่อจำเป็น</desc>
 <defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#172d42"/><stop offset="1" stop-color="#0c1b2c"/></linearGradient>
  <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#faf2dd"/><stop offset="1" stop-color="#d6cdbb"/></linearGradient>
  <style>text{font-family:Tahoma,'Leelawadee UI','Noto Sans Thai',sans-serif}.question{font-size:65px;font-weight:700;fill:#fff8e7;letter-spacing:-1px}.term{font-size:31px;font-weight:700;fill:#fff8e7}.meaning{font-size:27px;fill:#c6d1da}.big{font-size:60px;font-weight:700;fill:#f0c579}</style>
 </defs>
 <path fill="url(#bg)" d="M0 0H1600V900H0z"/>
 <path d="M970 0H1600V620H1140Z" fill="#20384d"/>
 <text x="76" y="69" font-size="20" letter-spacing="3" fill="#bdcbd5">INFORMATION SECURITY / WHY IT MATTERS</text>
 <text x="76" y="172" class="question">ถ้าข้อมูลถูกเปิดเผย</text>
 <text x="76" y="268" class="question">ถูกเปลี่ยน หรือใช้ไม่ได้</text>
 <text x="76" y="390" class="question" fill="#f0c579" style="fill:#f0c579">ภารกิจจะเดินต่อ</text>
 <text x="76" y="486" class="question">อย่างไร?</text>
 <path d="M80 540H149" stroke="#f0c579" stroke-width="4"/>
 <text x="172" y="550" fill="#d2dce3" font-size="29">เริ่มที่ข้อมูลสำคัญ ไม่ใช่แค่เครื่องมือ</text>
 <!-- Original editorial illustration: a business document, not a fake application. -->
 <g transform="translate(1020 135) rotate(7 205 200)">
  <path d="M-40 40H305L365 100V455H-40Z" fill="#050f1a" opacity=".3"/>
  <path d="M0 0H300L370 70V430H0Z" fill="url(#paper)"/>
  <path d="M300 0V70H370" fill="#acb6b3"/>
  <path d="M42 53H225" stroke="#1b3d4f" stroke-width="12"/>
  <path d="M42 94H248M42 117H214M42 215H319M42 239H304M42 263H272M42 337H190" stroke="#87948f" stroke-width="6"/>
  <path d="M42 158H211" stroke="#b0844b" stroke-width="24" opacity=".7"/>
  <path d="M244 314 279 290 314 314V350C314 376 297 391 279 401 261 391 244 376 244 350Z" fill="#173d4c"/>
  <path d="m262 346 12 12 23-28" fill="none" stroke="#f0c579" stroke-width="6"/>
 </g>
 <!-- These three marks communicate access, trustworthy data and dependable access. -->
 <g transform="translate(963 193)">
  <circle r="48" fill="#f0c579"/>
  <path d="M-18-2V-16A18 18 0 0 1 18-16V-2M-23-2H23V27H-23Z" fill="none" stroke="#172d42" stroke-width="5"/>
  <circle cy="11" r="4" fill="#172d42"/>
 </g>
 <g transform="translate(1455 330)">
  <circle r="48" fill="#668fa0"/>
  <path d="m-25 0 17 17L25-20" fill="none" stroke="#fff8e7" stroke-width="7"/>
 </g>
 <g transform="translate(1320 572)">
  <circle r="48" fill="#efbda2"/>
  <circle r="26" fill="none" stroke="#172d42" stroke-width="4"/>
  <path d="M0-17V0L15 10" fill="none" stroke="#172d42" stroke-width="4"/>
 </g>
 <path d="M76 626H1524" stroke="#5b6f80" stroke-width="1"/>
 <path d="M569 660V817M1066 660V817" stroke="#425b6e"/>
 <text x="76" y="704" class="big">C</text>
 <text x="143" y="704" class="term">Confidentiality</text>
 <text x="76" y="754" class="meaning">รักษาความลับ</text>
 <text x="76" y="798" class="meaning">ป้องกันการเปิดเผยต่อผู้ไม่มีสิทธิ์</text>
 <text x="602" y="704" class="big">I</text>
 <text x="646" y="704" class="term">Integrity</text>
 <text x="602" y="754" class="meaning">คงความถูกต้องครบถ้วน</text>
 <text x="602" y="798" class="meaning">ไม่ถูกแก้ไขโดยไม่ได้รับอนุญาต</text>
 <text x="1100" y="704" class="big">A</text>
 <text x="1171" y="704" class="term">Availability</text>
 <text x="1100" y="754" class="meaning">พร้อมให้ผู้มีสิทธิ์ใช้งาน</text>
 <text x="1100" y="798" class="meaning">เข้าถึงได้ในเวลาที่จำเป็น</text>
 <text x="76" y="864" fill="#a9bac7" font-size="23">ปกป้องทรัพย์สินสำคัญ เพื่อให้องค์กรบรรลุพันธกิจอย่างปลอดภัย</text>
</svg>
