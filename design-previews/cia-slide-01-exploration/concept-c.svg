 <path d="m1334 474 65-38m-65 63 65-38m-65 64 65-38" stroke="#8bb5ba" stroke-width="4"/>
 <circle cx="1374" cy="541" r="6" fill="#c5e597"/>
 <text x="1315" y="675" text-anchor="middle" class="tiny">บริการขององค์กร</text>
 <!-- Label leaders attach each goal to the shared service context. -->
 <path d="M260 347V365L303 391" fill="none" stroke="#7edbd9" stroke-width="2"/>
 <text x="76" y="290" fill="#7edbd9" class="term">C / Confidentiality</text>
 <text x="76" y="337" class="thai">เปิดเผยเฉพาะผู้มีสิทธิ์</text>
 <path d="M1300 347V363" fill="none" stroke="#c5e597" stroke-width="2"/>
 <text x="1102" y="290" fill="#c5e597" class="term">A / Availability</text>
 <text x="1102" y="337" class="thai">เข้าถึงได้เมื่อจำเป็น</text>
 <path d="M804 623V662" fill="none" stroke="#b6a7f0" stroke-width="2"/>
 <text x="804" y="704" text-anchor="middle" fill="#c5b7fb" class="term">I / Integrity</text>
 <text x="804" y="751" text-anchor="middle" class="thai">ปกป้องจากการแก้ไขหรือทำลายโดยไม่ได้รับอนุญาต</text>
 <path d="M76 798H1524" stroke="#50617e"/>
 <text x="76" y="849" font-size="27" fill="#f4f8ff">เป้าหมายคือภารกิจที่ดำเนินต่อได้อย่างปลอดภัย ไม่ใช่เพียงการมีเครื่องมือป้องกัน</text>
</svg>
