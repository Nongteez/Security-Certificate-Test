 <circle cx="366" cy="408" r="27" fill="#8fe3df"/>
 <path d="M338 461V450C338 416 394 416 394 450V493Z" fill="#569aa8"/>
 <text x="320" y="675" text-anchor="middle" class="tiny">ผู้มีสิทธิ์</text>
 <!-- Central information store: volume, visible faces and verification mark. -->
 <path d="m619 547 183-106 184 106-184 106Z" fill="#263d62" stroke="#5b78a3" stroke-width="2"/>
 <path d="M687 383V516C687 564 920 564 920 516V383Z" fill="url(#glass)" stroke="#8aa9cb" stroke-width="2"/>
 <ellipse cx="803.5" cy="383" rx="116.5" ry="45" fill="#547f9f" stroke="#b4d2e8" stroke-width="2"/>
 <path d="M687 430C687 479 920 479 920 430M687 475C687 524 920 524 920 475" fill="none" stroke="#8aa9cb" stroke-width="2"/>
 <path d="M804 360 839 381 804 402 769 381Z" fill="#b4d2e8"/>
 <text x="804" y="520" text-anchor="middle" fill="#fff" font-size="28">ข้อมูลสำคัญ</text>
 <circle cx="919" cy="553" r="35" fill="#b6a7f0"/>
 <path d="m902 553 11 11 23-28" fill="none" stroke="#211f41" stroke-width="5"/>
 <!-- Business service: generic, no real organization's asset or branded UI. -->
 <path d="m1147 538 171-99 170 99-170 98Z" fill="#263d62" stroke="#5b78a3" stroke-width="2"/>
