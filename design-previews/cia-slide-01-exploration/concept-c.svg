<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title description" lang="th">
 <title id="title">ข้อมูลที่ไว้ใจได้ ทำให้งานเดินต่อ</title>
 <desc id="description">ภาพระบบเชิงแนวคิดแสดงผู้มีสิทธิ์ ข้อมูลสำคัญ และบริการองค์กร รอบข้อมูลมีสามเป้าหมาย Confidentiality ควบคุมการเปิดเผย Integrity ปกป้องจากการแก้ไขโดยไม่ได้รับอนุญาต Availability ให้ผู้มีสิทธิ์เข้าถึงได้เมื่อจำเป็น ไม่ใช่ลำดับขั้นหรือการรับรองระบบว่าปลอดภัย</desc>
 <defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#101d36"/><stop offset="1" stop-color="#171a39"/></linearGradient>
  <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#527f9d"/><stop offset="1" stop-color="#203b5b"/></linearGradient>
  <pattern id="grid" width="64" height="36" patternUnits="userSpaceOnUse"><path d="M0 18 32 0 64 18 32 36Z" fill="none" stroke="#41506b" stroke-width=".7"/></pattern>
  <style>text{font-family:Tahoma,'Leelawadee UI','Noto Sans Thai',sans-serif}.term{font-size:35px;font-weight:700}.thai{font-size:29px;fill:#eef6ff}.body{font-size:25px;fill:#bdcfe4}.tiny{font-size:22px;fill:#bdcfe4}</style>
 </defs>
 <path fill="url(#bg)" d="M0 0H1600V900H0z"/>
 <path d="M0 330 800 140 1600 330V800H0Z" fill="url(#grid)" opacity=".36"/>
 <text x="76" y="69" font-size="20" letter-spacing="3" fill="#b1c7e0">CIA TRIAD / INFORMATION IN USE</text>
 <text x="76" y="148" font-size="61" font-weight="700" fill="#f4f8ff">ข้อมูลที่ไว้ใจได้ ทำให้งานเดินต่อ</text>
 <text x="79" y="203" font-size="29" fill="#bdcfe4">สามเป้าหมายในการปกป้องทรัพย์สินสำคัญขององค์กร</text>
 <!-- Meaningful service links, rather than a C → I → A sequence. -->
 <path d="M343 510 565 637 764 522M872 511 1068 400 1244 499" fill="none" stroke="#6987aa" stroke-width="3"/>
 <path d="M343 528 565 655 764 540M872 529 1068 418 1244 517" fill="none" stroke="#2f4d73" stroke-width="2"/>
 <circle cx="565" cy="637" r="6" fill="#7edbd9"/>
 <circle cx="1068" cy="400" r="6" fill="#c5e597"/>
 <!-- Authorized person and endpoint, drawn as an open illustration. -->
 <path d="m143 534 176-102 176 102-176 102Z" fill="#213e5c" stroke="#3b6380" stroke-width="2"/>
