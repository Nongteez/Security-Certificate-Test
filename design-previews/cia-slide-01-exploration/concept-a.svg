<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title description" lang="th">
 <title id="title">ปกป้องข้อมูล เพื่อให้ภารกิจเดินต่อ</title>
 <desc id="description">CIA เป็นสามเป้าหมายร่วมกันรอบข้อมูลสำคัญ ไม่ใช่ลำดับขั้น Confidentiality ป้องกันการเปิดเผยโดยไม่มีสิทธิ์ Integrity ป้องกันการแก้ไขโดยไม่ได้รับอนุญาต Availability ให้ผู้มีสิทธิ์ใช้งานได้เมื่อจำเป็น</desc>
 <defs>
  <linearGradient id="field" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#e4eff0"/><stop offset="1" stop-color="#f3eee4"/></linearGradient>
  <style>text{font-family:Tahoma,'Leelawadee UI','Noto Sans Thai',sans-serif} .term{font-size:38px;font-weight:700;letter-spacing:-1px}.thai{font-size:31px;font-weight:700}.explain{font-size:25px;fill:#3e5360}.letter{font-size:60px;font-weight:700;fill:white;text-anchor:middle}</style>
 </defs>
 <path fill="#f8f6ef" d="M0 0H1600V900H0z"/>
 <path fill="#173d4c" d="M0 0H18V900H0z"/>
 <text x="76" y="69" font-size="20" letter-spacing="3" fill="#4d6b74">SECURITY PRINCIPLES / 01</text>
 <text x="76" y="151" fill="#153c4a" font-size="62" font-weight="700">ปกป้องข้อมูล เพื่อให้ภารกิจเดินต่อ</text>
 <text x="79" y="206" fill="#4a626c" font-size="29">ความมั่นคงปลอดภัยมีเป้าหมายมากกว่าการติดตั้งเครื่องมือ</text>
 <!-- Three equal vertices: a relationship, with no directional arrows. -->
 <path d="M800 298 552 650 1048 650Z" fill="url(#field)" stroke="#c2d2cf" stroke-width="2"/>
 <path d="M800 298 552 650 1048 650Z" fill="none" stroke="#789b9d" stroke-width="4"/>
 <path d="M800 354V474M598 627 733 550M1001 627 864 550" fill="none" stroke="#b7ccc8" stroke-width="2"/>
 <circle cx="800" cy="298" r="56" fill="#176b78"/>
 <text x="800" y="319" class="letter">C</text>
 <path d="M744 298H635" stroke="#176b78" stroke-width="2"/>
 <text x="76" y="306" fill="#176b78" class="term">Confidentiality</text>
 <text x="76" y="354" fill="#153c4a" class="thai">การรักษาความลับ</text>
 <text x="76" y="400" class="explain">ป้องกันการเปิดเผยข้อมูล</text>
 <text x="76" y="438" class="explain">ต่อผู้ไม่มีสิทธิ์</text>
 <circle cx="552" cy="650" r="56" fill="#785343"/>
 <text x="552" y="672" class="letter">I</text>
 <path d="M496 650H456" stroke="#785343" stroke-width="2"/>
 <text x="76" y="575" fill="#785343" class="term">Integrity</text>
 <text x="76" y="623" fill="#153c4a" class="thai">ความถูกต้องครบถ้วน</text>
 <text x="76" y="672" class="explain">ป้องกันการแก้ไขหรือทำลาย</text>
 <text x="76" y="710" class="explain">โดยไม่ได้รับอนุญาต</text>
 <circle cx="1048" cy="650" r="56" fill="#466d4e"/>
 <text x="1048" y="672" class="letter">A</text>
 <path d="M1104 650H1132" stroke="#466d4e" stroke-width="2"/>
 <text x="1138" y="575" fill="#466d4e" class="term">Availability</text>
 <text x="1138" y="623" fill="#153c4a" class="thai">ความพร้อมใช้งาน</text>
 <text x="1138" y="672" class="explain">ให้ผู้มีสิทธิ์เข้าถึงได้</text>
 <text x="1138" y="710" class="explain">ในเวลาที่จำเป็น</text>
 <!-- The asset is shared by all three goals. -->
 <path d="M800 425 869 453V511C869 557 839 587 800 606 761 587 731 557 731 511V453Z" fill="#173d4c"/>
 <path d="M781 465H815L830 480V526H781Z" fill="none" stroke="#cce5e0" stroke-width="3"/>
 <path d="M815 465V481H830M791 493H819M791 504H819M791 515H811" fill="none" stroke="#cce5e0" stroke-width="2"/>
 <text x="800" y="558" text-anchor="middle" font-size="24" fill="white">ข้อมูลสำคัญ</text>
 <text x="1120" y="326" fill="#7a8d89" font-size="102" font-weight="700">CIA</text>
 <text x="1122" y="372" fill="#4a626c" font-size="28">สามเป้าหมายร่วมกัน</text>
 <path d="M76 783H1524" stroke="#b9c7c2"/>
 <text x="76" y="836" fill="#173d4c" font-size="28">มาตรการควบคุมสนับสนุนเป้าหมายเหล่านี้อย่างน้อยหนึ่งด้าน</text>
 <text x="1524" y="840" fill="#4d6b74" font-size="22" text-anchor="end">CIA TRIAD</text>
</svg>
